# ============================================
# 夜语者·黯 —— 全部台词（共 4 条）
# S7 落地台词已删除：阵营选择移交独立阵营插件，引导只介绍世界观
# ============================================
npc:
  id: an
  name: "夜语者·黯"
  texture: "an.png"
  background_default: "bg_yuanyu_night.png"

dialogues:
  - id: S4_1
    npc: an
    expression: cold
    background: yuanyu_night
    text: "我是黯，暮夜同盟。这一边，是我们的地盘——渊域。"

  - id: S4_2
    npc: an
    expression: cold
    background: yuanyu_night
    text: "你睡觉的时候，炽壤的人正在干活。你醒着的时候，他们正睡着。"

  - id: S4_3
    npc: an
    expression: cold
    background: yuanyu_night
    text: "夜里是我们的主场。怪物多，但也藏着别处没有的东西——炽阳碎片、矿脉、裂缝里那些不为人知的东西。"

  - id: S4_4
    npc: an
    expression: cold
    background: yuanyu_night
    text: "我们不信秩序，我们信实力。强者为尊。"
