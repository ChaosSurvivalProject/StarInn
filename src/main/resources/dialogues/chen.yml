# ============================================
# 誓约使徒·晨 —— 全部台词（共 4 条）
# S6 落地台词已删除：阵营选择移交独立阵营插件，引导只介绍世界观
# ============================================
npc:
  id: chen
  name: "誓约使徒·晨"
  texture: "chen.png"
  background_default: "bg_chirang_day.png"

dialogues:
  - id: S2_1
    npc: chen
    expression: warm
    background: chirang_day
    text: "我是晨，黎明誓约的人。你眼前这个，就是我们扎根的地方——炽壤。"

  - id: S2_2
    npc: chen
    expression: warm
    background: chirang_day
    text: "白天长，适合种地、建家、攒东西。我们的信条是：以光为界，守土求生。"

  - id: S2_3
    npc: chen
    expression: serious
    background: chirang_day
    text: "但别以为白天就安全。怪物越来越不怕光了，夜里也别乱跑。"

  - id: S2_4
    npc: chen
    expression: serious
    background: chirang_day
    text: "记住一句：你天黑的时候，渊域的人正清醒着。"
