# ============================================
# 星穹旅驿 · 新手引导插件 配置文件（全中文注释）
# 修改任何一项后执行 /starinn reload 即可生效；改端口无需重启服务器
# 注意：本文件请保存为 UTF-8（无 BOM），否则中文可能乱码
# ============================================

# 是否启用本插件（false 则完全关闭引导功能；资源包服务也会停止）
enabled: true

# ============================================
# 资源包下发设置（端口完全可配，代码中无任何硬编码端口）
# ============================================
resource-pack:
  # 【内置 HTTP 服务监听端口】★ 服主端口申请下来后改这里，并在防火墙/云安全组放行该端口
  # 默认 25585 仅为占位示例；改成你申请到的端口即可，改完执行 /starinn reload 或重启生效
  # 若端口被占用：插件不会崩溃，日志会提示「端口 X 被占用」，仅资源包下发关闭、引导照常
  builtin-port: 25585

  # 【内置 HTTP 服务监听地址】一般保持 0.0.0.0（允许所有网卡访问）
  # 想只允许本机访问可改 127.0.0.1（那样基岩/外部玩家就下载不到了）
  builtin-host: "0.0.0.0"

  # 【资源包下载 URL 的固定路径】内置服务对外发放路径，一般不用改
  # 完整下发地址 = http://<public-host>:<builtin-port><serve-path>
  serve-path: "/StarInnResourcePack.zip"

  # 【对外 IP 或域名】基岩玩家（Geyser）需能访问到此地址，否则资源包下载会失败（不会被踢）
  # 留空 = 自动取服务器 IP；服务器在 NAT/域名后面请务必填写公网 IP 或域名
  # 例：public-host: "mc.yourdomain.com" 或 public-host: "1.2.3.4"
  public-host: ""

  # 是否玩家一进服就自动推送资源包下载（false 则只放在服务器上，谁要谁自己取）
  auto-send: true

  # 是否启动时自动组装资源包 zip（把 jar 内固化的彩色立绘打包 + SHA-256 回填本文件）
  # 关闭时使用 plugins/StarInn/StarInnResourcePack.zip 现成文件；两者都没有则不下发
  auto-generate: true

  # SHA-256 校验值：插件打包后自动回填到这里（文本级原位替换，注释全部保留），请勿手改
  # 启动时 zip 的实际 hash 与该值一致 -> 跳过重新生成；不一致（或换过贴图）-> 自动重建
  sha256: ""

# ============================================
# 引导节奏设置（都是 tick/秒数，与端口无关）
# ============================================
guide:
  delay-on-join: 40       # 玩家进服后延迟多少 tick 开始引导（20 tick = 1 秒）
  char-interval: 2        # 逐字显示速度：每隔多少 tick 显示一个字（越小越快）
  idle-timeout: 300       # 玩家多少秒无操作后，NPC 先追问一句（不会直接踢出）
  idle-timeout-2: 120     # 追问后再过多少秒仍无操作：自动关闭引导并标记“已跳过”，绝不永久停留
  greeting-duration: 40   # 老玩家/已跳过玩家进服问候语显示时长（tick）

# ============================================
# 阵营选择说明（纯注释，无可配置项）
# ============================================
# 阵营选择已移交独立阵营插件：玩家进服 10 分钟后由该插件弹窗正式选择炽壤/渊域。
# 本引导插件只讲世界观、介绍两边，S5_4 播完即标记 COMPLETED 结束，
# 不再做阵营落地检测、不再有触发区域配置（原 trigger.chirang / trigger.yuanyu 一类
# 配置项本文件从未启用，如需保留请在服主自己修改的旧副本中自行注释，本插件不读取）。

# ============================================
# 数据库设置
# ============================================
database:
  file: "guides.db"       # 进度数据库文件名，存放在 plugins/StarInn/ 下
                          # SQLite 不可用时自动降级为内存进度（不持久化），日志告警，引导照常

# ============================================
# 命令与权限
# ============================================
command:
  reload-permission: "starinn.reload"   # /starinn reload、/starinn status、/starinn pack regen 的权限节点
  reset-permission: "starinn.reset"     # /starinn reset <玩家> 的权限节点

# ============================================
# 日志设置
# ============================================
debug: false              # 开启后输出详细调试日志（资源包请求、会话推进等；排错时开，平时关）

# ============================================
# 换正式立绘说明（不需要重新编译插件）
# ============================================
# 彩色立绘已固化为真实 PNG 打进 jar。服主日后要换成美术正式立绘时：
#   1. 把同名 PNG 放进 plugins/StarInn/textures/（wu.png / chen.png / an.png /
#      dialogue_bg.png / bg_inn_dusk.png / bg_chirang_day.png / bg_yuanyu_night.png / pack.png）
#   2. 尺寸必须是 2 的幂（64/128/256/512…），标准 PNG；不合规会被日志提示并忽略
#   3. 执行 /starinn pack regen —— 自动删旧 zip、重新打包、重算 hash、重启下发服务
# 资源包总大小请控制在 5MB 以内（基岩端 Geyser 转码友好线）；
# 资源包内不含字体目录 / shader / optifine 目录，双端通用。
